services:
  # ── Backend: FastAPI  ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    volumes:
      # Modelos k-fold (.pth)
      - ./backend/models:/app/models:ro
      # Mapas XAI pre-calculados (.npz)
      - ./backend/xai_maps:/app/xai_maps:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── Frontend: React (Vite build) nginx ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
