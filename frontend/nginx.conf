server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Archivos estáticos del SPA ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy hacia el backend FastAPI ─────────────────────────────────────
    # El nombre "backend" resuelve al servicio de docker-compose.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts largos: SHAP/LIME pueden tardar hasta 10 minutos
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Deshabilitar buffering para streaming (chat con Gemini)
        proxy_buffering       off;
    }

    # ── Health check del backend (accesible desde el host) ─────────────────
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # ── Compresión gzip ────────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml;
    gzip_min_length 1024;
}
